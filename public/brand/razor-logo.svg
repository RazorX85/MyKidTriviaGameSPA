<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- RaZoR: a quasar drawn as a bright white saw blade, with platinum lettering in Russo One. -->
  <defs>
    <radialGradient id="rz-space" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="1" stop-color="#03050a"/>
    </radialGradient>
    <radialGradient id="rz-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#5aa8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5a6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rz-jet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#cfe6ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#cfe6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rz-blade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f9ff"/>
      <stop offset="0.85" stop-color="#cfe4ff"/>
      <stop offset="1" stop-color="#9cc8ff"/>
    </radialGradient>
    <linearGradient id="rz-arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb8ff"/>
      <stop offset="1" stop-color="#d8ebff"/>
    </linearGradient>
    <radialGradient id="rz-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bfe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rz-platinum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/>
      <stop offset="0.3" stop-color="#d9dde3"/>
      <stop offset="0.5" stop-color="#8e96a2"/>
      <stop offset="0.56" stop-color="#b8bec8"/>
      <stop offset="0.8" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#9aa2ae"/>
    </linearGradient>
    <filter id="rz-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rz-shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>
